<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Port App Manager</title>
  <style>
    :root{--bg:#0d0c12;--panel:#17151f;--panel2:#201d2b;--line:#312c40;--text:#f5f2fb;--muted:#aaa3b8;--brand:#9b7cff;--brand2:#6848d7;--good:#61d69b;--warn:#ffcb6b;--bad:#ff767f;--shadow:0 18px 50px rgba(0,0,0,.28)}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#2b2051 0,transparent 34%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
    button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}.shell{width:min(1040px,100%);margin:auto;padding:26px 20px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:13px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,var(--brand),#5b3fc4);display:grid;place-items:center;font-weight:900;box-shadow:0 10px 30px rgba(132,94,255,.35)}h1{font-size:20px;margin:0}.sub{color:var(--muted);font-size:13px}.online{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 5px rgba(97,214,155,.12)}
    .notice{display:flex;gap:10px;background:rgba(97,214,155,.07);border:1px solid rgba(97,214,155,.2);color:#b9e8ce;padding:11px 14px;border-radius:12px;margin-bottom:18px}.notice.warn{background:rgba(255,203,107,.08);border-color:rgba(255,203,107,.22);color:#e9d7ae}.tabs{display:flex;gap:7px;padding:5px;background:#13111a;border:1px solid var(--line);border-radius:14px;margin-bottom:18px}.tab{flex:1;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:10px;font-weight:700}.tab.active{background:var(--panel2);color:white;box-shadow:0 5px 16px rgba(0,0,0,.25)}.count{display:inline-grid;place-items:center;min-width:20px;height:20px;margin-left:5px;padding:0 5px;border-radius:10px;background:#302a42;color:#dcd3fa;font-size:11px}
    .view{display:none}.view.active{display:block}.card{background:linear-gradient(160deg,rgba(32,29,43,.97),rgba(22,20,30,.97));border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.pad{padding:22px}.section-title{font-size:18px;font-weight:800;margin:0 0 4px}.section-copy{color:var(--muted);margin:0 0 18px}.drop{border:1.5px dashed #5c4a8b;border-radius:16px;padding:34px 18px;text-align:center;background:rgba(155,124,255,.035);transition:.18s}.drop.over{border-color:var(--brand);background:rgba(155,124,255,.1)}.drop-icon{width:54px;height:54px;margin:0 auto 12px;border-radius:16px;background:#2b2440;display:grid;place-items:center;font-size:25px}.file-input{display:none}.primary,.secondary,.danger,.ghost{border:0;border-radius:11px;padding:10px 14px;font-weight:750}.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:white}.primary:disabled{filter:saturate(.2);opacity:.45;cursor:not-allowed}.secondary{background:#302942;color:#eee}.danger{background:rgba(255,118,127,.14);color:#ffafb5;border:1px solid rgba(255,118,127,.2)}.ghost{background:transparent;color:var(--muted)}.selected{display:none;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:13px;background:#15121e;border-radius:12px}.selected.show{display:flex}.selected-name{font-weight:750;word-break:break-all}.selected-meta{color:var(--muted);font-size:12px}.actions{display:flex;gap:9px;align-items:center}
    .progress{display:none;margin-top:16px}.progress.show{display:block}.track{height:9px;background:#0d0b12;border-radius:10px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--brand2),var(--brand));transition:width .18s}.progress-row{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:7px}.toolbar{display:flex;gap:10px;margin-bottom:12px}.search{flex:1;border:1px solid var(--line);background:var(--panel);color:white;border-radius:12px;padding:11px 13px;outline:none}.search:focus{border-color:#6f59aa}.list{overflow:hidden}.row{display:flex;align-items:center;gap:13px;padding:15px 17px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row-main{min-width:0;flex:1}.row-name{font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-detail{font-size:12px;color:var(--muted)}.badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:#2c2740;color:#d9cff9}.badge.app{background:rgba(97,214,155,.12);color:#8ee8ba}.empty{padding:38px 20px;text-align:center;color:var(--muted)}.empty b{display:block;color:#ddd6e7;margin-bottom:3px}.trash-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .pair{position:fixed;inset:0;background:rgba(5,4,8,.82);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.pair.show{display:flex}.pair-card{width:min(410px,100%);padding:25px;background:#1b1824;border:1px solid #3b3450;border-radius:20px;box-shadow:var(--shadow)}.pair-card h2{margin:0 0 6px}.pair-card p{color:var(--muted);margin:0 0 16px}.code{width:100%;letter-spacing:.35em;text-align:center;font-size:25px;font-weight:900;color:white;background:#0f0d14;border:1px solid #4a3e68;border-radius:12px;padding:12px;outline:none}.pair-error{min-height:23px;color:var(--bad);font-size:13px;margin-top:6px}.pair-card .primary{width:100%;margin-top:4px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,25px);opacity:0;pointer-events:none;background:#282333;border:1px solid #443b58;border-radius:12px;padding:11px 15px;box-shadow:var(--shadow);transition:.2s;z-index:20;max-width:min(460px,calc(100% - 30px))}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:640px){.shell{padding:18px 13px 86px}.top{align-items:flex-start}.online{margin-top:6px}.tabs{position:fixed;z-index:5;left:10px;right:10px;bottom:9px;margin:0;box-shadow:0 8px 35px #000}.pad{padding:17px}.row{align-items:flex-start;flex-wrap:wrap}.row .actions{width:100%;justify-content:flex-end}.notice{font-size:13px}.drop{padding:26px 12px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand"><div class="logo">PM</div><div><h1>Port App Manager</h1><div class="sub" id="deviceName">正在连接设备…</div></div></div>
      <div class="online"><span class="dot" id="onlineDot"></span><span id="onlineText">正在检查连接…</span></div>
    </header>
    <div class="notice"><span>ⓘ</span><span>远程管理仅在掌机 APP Manager 保持打开时可用。</span></div>
    <nav class="tabs" aria-label="功能导航">
      <button class="tab active" data-view="install">安装</button>
      <button class="tab" data-view="installed">已安装 <span class="count" id="itemCount">0</span></button>
      <button class="tab" data-view="trash">回收站 <span class="count" id="trashCount">0</span></button>
    </nav>

    <section class="view active" id="view-install">
      <div class="card pad">
        <h2 class="section-title">上传并安装</h2>
        <p class="section-copy" id="installCopy">选择 ZIP 安装包，上传后将自动检查并安装到正确位置。</p>
        <div class="drop" id="dropZone">
          <div class="drop-icon">⇧</div>
          <b>拖放 zip 到这里</b>
          <div class="sub">或从电脑选择文件，最大 4 GiB</div>
          <button class="secondary" id="chooseButton" style="margin-top:14px">选择 zip</button>
          <input class="file-input" id="fileInput" type="file" accept=".zip,application/zip">
        </div>
        <div class="selected" id="selectedFile">
          <div><div class="selected-name" id="fileName"></div><div class="selected-meta" id="fileSize"></div></div>
          <div><label class="selected-meta"><input id="replaceExisting" type="checkbox"> 覆盖同名 APP 或游戏数据目录（重复 SH 仍自动编号）</label></div>
          <div class="actions"><button class="ghost" id="clearFile">移除</button><button class="primary" id="installButton">开始安装</button></div>
        </div>
        <div class="progress" id="progressBox" role="progressbar" aria-label="安装进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="track"><div class="bar" id="progressBar"></div></div>
          <div class="progress-row"><span id="progressStage">准备上传…</span><span id="progressValue">0%</span></div>
          <div class="actions" style="justify-content:flex-end;margin-top:10px"><button class="secondary" id="cancelUpload">取消</button></div>
        </div>
      </div>
    </section>

    <section class="view" id="view-installed">
      <div class="toolbar"><input class="search" id="search" placeholder="搜索 APP 或 Port…"><button class="secondary" id="refreshButton">刷新</button></div>
      <div class="card list" id="itemList"><div class="empty">正在读取…</div></div>
    </section>

    <section class="view" id="view-trash">
      <div class="trash-head"><div><h2 class="section-title">回收站</h2><div class="sub">可以还原新版本产生的项目，或永久清空。</div></div><button class="danger" id="emptyTrash">清空回收站</button></div>
      <div class="card list" id="trashList"><div class="empty">正在读取…</div></div>
    </section>
  </main>

  <div class="pair show" id="pairDialog" role="dialog" aria-modal="true" aria-labelledby="pairTitle">
    <form class="pair-card" id="pairForm">
      <h2 id="pairTitle">连接这台掌机</h2>
      <p>请在掌机 APP Manager 的远程管理提示中查看 6 位配对码。</p>
      <input class="code" id="pairCode" aria-label="6 位配对码" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
      <div class="pair-error" id="pairError" role="alert" aria-live="assertive"></div>
      <button class="primary" type="submit">连接</button>
    </form>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const state={token:sessionStorage.getItem('pam-token')||'',snapshot:null,file:null,busy:false,managing:false,xhr:null};
    const $=id=>document.getElementById(id);
    function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2800)}
    function showPair(message=''){state.token='';sessionStorage.removeItem('pam-token');$('pairError').textContent=message;$('pairDialog').classList.add('show');setTimeout(()=>$('pairCode').focus(),50)}
    async function api(path,options={}){const headers=new Headers(options.headers||{});if(state.token)headers.set('X-AppManager-Token',state.token);const response=await fetch(path,{...options,headers});let data={};try{data=await response.json()}catch(_){data={ok:false,error:'设备返回了无法识别的内容'}}if(response.status===401){showPair(data.error||'请重新配对');throw new Error(data.error||'unauthorized')}if(!response.ok||data.ok===false)throw new Error(data.error||`请求失败 (${response.status})`);return data}
    async function loadStatus(){try{const response=await fetch('/api/status',{cache:'no-store'});if(!response.ok)throw new Error('offline');$('onlineText').textContent='局域网已连接';$('onlineDot').style.background='var(--good)'}catch(_){$('onlineText').textContent='连接已中断';$('onlineDot').style.background='var(--bad)'}}
    async function pair(code){const response=await fetch('/api/session',{method:'POST',body:code});const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error||'配对失败');state.token=data.token;sessionStorage.setItem('pam-token',data.token);await Promise.all([refresh(),loadStatus()]);$('pairDialog').classList.remove('show')}
    $('pairForm').addEventListener('submit',async event=>{event.preventDefault();const code=$('pairCode').value.trim();if(!/^\d{6}$/.test(code)){$('pairError').textContent='请输入 6 位数字';return}try{$('pairError').textContent='正在连接…';await pair(code);$('pairError').textContent=''}catch(error){$('pairError').textContent=error.message}});
    document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(item=>item.classList.toggle('active',item===button));document.querySelectorAll('.view').forEach(view=>view.classList.toggle('active',view.id===`view-${button.dataset.view}`))}));
    function formatBytes(bytes){if(!bytes)return '0 B';const units=['B','KiB','MiB','GiB'];const power=Math.min(Math.floor(Math.log(bytes)/Math.log(1024)),3);return `${(bytes/1024**power).toFixed(power?1:0)} ${units[power]}`}
    function can(name){return state.snapshot?.capabilities?.[name]===true}
    function setFile(file){if(file&&!file.name.toLowerCase().endsWith('.zip')){toast('只支持 zip 安装包');return}state.file=file;$('selectedFile').classList.toggle('show',!!file);$('fileName').textContent=file?.name||'';$('fileSize').textContent=file?formatBytes(file.size):'';$('fileInput').value='';$('installButton').disabled=state.busy||!can('install');$('progressBox').classList.remove('show')}
    $('chooseButton').addEventListener('click',()=>$('fileInput').click());$('fileInput').addEventListener('change',event=>setFile(event.target.files[0]));$('clearFile').addEventListener('click',()=>setFile(null));
    const drop=$('dropZone');['dragenter','dragover'].forEach(name=>drop.addEventListener(name,event=>{event.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(name=>drop.addEventListener(name,event=>{event.preventDefault();drop.classList.remove('over')}));drop.addEventListener('drop',event=>setFile(event.dataTransfer.files[0]));
    function setProgress(percent,stage){$('progressBar').style.width=`${percent}%`;$('progressValue').textContent=`${percent}%`;$('progressBox').setAttribute('aria-valuenow',String(percent));if(stage)$('progressStage').textContent=stage}
    function upload(){if(!state.file||state.busy||state.managing)return;if(!can('install')){toast('当前设备配置未开放远程安装');return}if(state.file.size>4*1024**3){toast('文件超过 4 GiB 上限');return}const replace=$('replaceExisting').checked;if(replace&&!confirm('若安装包包含同名 APP 或游戏数据目录，将直接替换现有内容。重复 SH 仍会自动添加编号。继续上传？'))return;state.busy=true;$('installButton').disabled=true;$('progressBox').classList.add('show');setProgress(0,'正在上传…');const xhr=new XMLHttpRequest();state.xhr=xhr;xhr.open('POST','/api/upload');xhr.setRequestHeader('X-AppManager-Token',state.token);xhr.setRequestHeader('X-Filename',encodeURIComponent(state.file.name));xhr.setRequestHeader('X-AppManager-Replace',replace?'1':'0');xhr.upload.onprogress=event=>{if(!event.lengthComputable)return;const percent=Math.round(event.loaded/event.total*100);setProgress(percent,percent===100?'上传完成，正在校验并事务化安装…':'正在上传…')};xhr.onload=async()=>{state.xhr=null;state.busy=false;$('installButton').disabled=!can('install');let data={};try{data=JSON.parse(xhr.responseText)}catch(_){data={ok:false,error:'无法识别设备响应'}}if(xhr.status===401){showPair(data.error);return}if(!data.ok){$('progressStage').textContent='安装失败或已取消，现有文件保持不变';toast(data.error||'安装失败');return}const installed=data.result?.installed?.length||0;const conflicts=data.result?.conflicts?.length||0;setProgress(100);if(conflicts){$('progressStage').textContent=`发现 ${conflicts} 个同名目标，未安装并保留原文件`;$('progressValue').textContent='未安装';toast('存在同名项目，安装包未写入')}else{$('progressStage').textContent=`安装包安装成功（写入 ${installed} 个组件）`;toast('安装完成');setFile(null)}await refresh()};xhr.onerror=()=>{state.xhr=null;state.busy=false;$('installButton').disabled=!can('install');$('progressStage').textContent='连接中断，设备会清理未完成上传';toast('上传连接中断，请重试')};xhr.onabort=()=>{state.xhr=null;state.busy=false;$('installButton').disabled=!can('install');$('progressStage').textContent='正在安全取消…'};xhr.send(state.file)}
    $('installButton').addEventListener('click',upload);
    $('cancelUpload').addEventListener('click',async()=>{if(!state.busy)return;state.xhr?.abort();try{await api('/api/cancel',{method:'POST'})}catch(_){}toast('已请求取消，事务提交阶段会安全完成')});
    function makeButton(label,className,handler){const button=document.createElement('button');button.className=className;button.textContent=label;button.addEventListener('click',handler);return button}
    async function manage(action,paths,success){if(state.busy||state.managing){toast('另一项操作仍在进行，请稍候');return}state.managing=true;try{await api('/api/manage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,paths,revision:state.snapshot?.revision||''})});toast(success);await refresh()}catch(error){if(String(error.message).includes('inventory changed'))await refresh();throw error}finally{state.managing=false}}
    function renderItems(){const query=$('search').value.trim().toLowerCase();const items=(state.snapshot?.items||[]).filter(item=>item.name.toLowerCase().includes(query));const list=$('itemList');list.replaceChildren();if(!items.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML='<b>没有匹配项目</b>可以回到“安装”上传新的 zip。';list.append(empty);return}items.forEach(item=>{const row=document.createElement('div');row.className='row';const badge=document.createElement('span');badge.className=`badge ${item.kind}`;badge.textContent=item.kind==='app'?'APP':'PORT';const main=document.createElement('div');main.className='row-main';const name=document.createElement('div');name.className='row-name';name.textContent=item.name;const detail=document.createElement('div');detail.className='row-detail';detail.textContent=!item.manageable?'当前设备配置为只读':item.keeps_shared_data?'卸载时会保留共享或无法确认的数据目录':'卸载内容会先进入回收站';main.append(name,detail);const actions=document.createElement('div');actions.className='actions';if(item.manageable)actions.append(makeButton('卸载','danger',async()=>{if(!confirm(`卸载“${item.name}”？\n文件会先进入回收站。`))return;try{await manage('uninstall',item.paths,'已移入回收站')}catch(error){toast(error.message)}}));row.append(badge,main,actions);list.append(row)})}
    function bucketName(bucket){if(bucket.startsWith('apps-'))return 'APP';return {scripts:'启动项','script-images':'图片',images:'图片',data:'游戏数据',legacy:'旧项目'}[bucket]||'其他项目'}
    function renderTrash(){const items=state.snapshot?.trash||[];const list=$('trashList');list.replaceChildren();const manageable=can('trash');$('emptyTrash').disabled=!manageable||!items.length;if(!items.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML='<b>回收站是空的</b>卸载的 APP 和 Port 会先放到这里。';list.append(empty);return}items.forEach(item=>{const row=document.createElement('div');row.className='row';const badge=document.createElement('span');badge.className='badge';badge.textContent=bucketName(item.bucket);const main=document.createElement('div');main.className='row-main';const name=document.createElement('div');name.className='row-name';name.textContent=item.name+(item.is_dir?'/':'');const detail=document.createElement('div');detail.className='row-detail';detail.textContent=!manageable?'当前设备配置为只读':item.restore_conflict?'原目录已有同名项目，还原前需确认覆盖':item.restorable?'可还原到原目录':'旧版项目仅能永久删除';main.append(name,detail);const actions=document.createElement('div');actions.className='actions';if(manageable&&item.restorable)actions.append(makeButton(item.restore_conflict?'覆盖还原':'还原',item.restore_conflict?'danger':'secondary',async()=>{const action=item.restore_conflict?'restore_replace':'restore';if(item.restore_conflict&&!confirm(`原目录已有“${item.name}”。覆盖并还原？\n当前同名项目会先移入回收站。`))return;try{await manage(action,[item.path],item.restore_conflict?'已覆盖并还原':'已还原')}catch(error){toast(error.message)}}));if(manageable)actions.append(makeButton('永久删除','danger',async()=>{if(!confirm(`永久删除“${item.name}”？此操作无法撤销。`))return;try{await manage('delete',[item.path],'已永久删除')}catch(error){toast(error.message)}}));row.append(badge,main,actions);list.append(row)})}
    async function refresh(){const data=await api('/api/snapshot');state.snapshot=data;$('deviceName').textContent=`${data.device.name} · ${data.device.platform}`;$('itemCount').textContent=data.items.length;$('trashCount').textContent=data.trash.length;const install=can('install');$('chooseButton').disabled=!install;$('installButton').disabled=state.busy||!install;$('installCopy').textContent=install?'选择 ZIP 安装包，上传后将自动检查并安装到正确位置。':'当前设备配置未开放远程安装，仍可查看已安装项目和回收站。';renderItems();renderTrash()}
    $('search').addEventListener('input',renderItems);$('refreshButton').addEventListener('click',()=>refresh().catch(error=>toast(error.message)));$('emptyTrash').addEventListener('click',async()=>{const count=state.snapshot?.trash?.length||0;if(!count||!confirm(`永久清空回收站中的 ${count} 个项目？此操作无法撤销。`))return;try{await manage('empty_trash',[],'回收站已清空')}catch(error){toast(error.message)}});
    loadStatus();setInterval(loadStatus,5000);if(state.token)refresh().then(()=>$('pairDialog').classList.remove('show')).catch(error=>{$('pairError').textContent=`读取设备状态失败：${error.message}。请稍后重试连接。`;$('pairDialog').classList.add('show')});else showPair();
  </script>
</body>
</html>
