[package]
name = "appmanager-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Safe, app-specific core types for Port App Manager"

[dependencies]
chardetng = "1.0"
encoding_rs = "0.8"
libc = "0.2"
md5 = "0.7"
portkit-core = { path = "../portkit-core" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror = "2"
tree-sitter = "=0.25.10"
tree-sitter-bash = "=0.25.1"
sevenz-rust2 = { version = "=0.20.2", default-features = false, features = [
    "aes256",
    "brotli",
    "bzip2",
    "deflate",
    "lz4",
    "ppmd",
    "zstd",
] }
zip = { version = "2.4", default-features = false, features = [
    "aes-crypto",
    "bzip2",
    "deflate",
    "deflate64",
    "lzma",
    "xz",
    "zstd",
] }

[dev-dependencies]
serde_json = "1"
sevenz-rust2 = { version = "=0.20.2", default-features = false, features = ["compress", "util"] }
tempfile = "3"
